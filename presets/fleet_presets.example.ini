# Master Local AI Fleet Presets for 24GB VRAM (e.g., NVIDIA GeForce RTX 3090 / 4090)
# Launch with: llama-server --models-preset presets/fleet_presets.example.ini --models-max 2 --load-mode dio --port 18436
# Note: [bge-m3] uses n-gpu-layers = 0 so it stays permanently co-resident in system RAM (CPU)
# while any 27B/30B/32B LLM loads on the GPU without VRAM thrashing.

[Qwen3.8-27B-UD-Q4_K_M]
model = D:\ai_models\Qwen3.8-27B-UD-Q4_K_M.gguf
mmproj = D:\ai_models\assets\mmproj-Qwen3.8-27B-BF16.gguf
alias = qwen3.8-27b,qwen3.8-27b-ud-q4_k_m,general,default
n-gpu-layers = 99
slots = 1
ctx-size = 49152
batch-size = 2048
ubatch-size = 1024
spec-type = draft-mtp
spec-draft-n-max = 2
cache-type-k = q8_0
cache-type-v = q4_0
flash-attn = on
backend-sampling = on
spec-draft-backend-sampling = on
threads = 6
threads-batch = 16
top-k = 20
top-p = 0.95
temp = 0.7
min-p = 0.0

